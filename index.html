<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇱🇦</text></svg>" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FF6900" />
    <meta name="description" content="老挝语学习 - 在老挝做生意必备" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lao Learner" />
    <link rel="manifest" href="./manifest.json" />
    <title>老挝语学习 - Lao Learner</title>
    <!-- 字体异步加载：避免阻塞渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <!-- 内联加载动画：React 渲染前立即显示，React 就绪后自动移除 -->
    <div id="app-loading" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#FF6900,#FF8C00);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
      <div style="font-size:72px;margin-bottom:16px;">🇱🇦</div>
      <div style="color:#fff;font-size:20px;font-weight:600;margin-bottom:24px;">老挝语学习</div>
      <div style="width:40px;height:40px;border:4px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <div style="color:rgba(255,255,255,0.8);font-size:14px;margin-top:16px;">正在加载...</div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
